name: Servidor de sincronización

on:
  push:
    paths:
      - "server/sync/**"
      - ".github/workflows/sync-server.yml"
  workflow_dispatch:

concurrency:
  group: sync-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/sync
    steps:
      - uses: actions/checkout@v4

      - name: Revisar el código
        run: node --check src/index.js

      - name: Crear tablas que falten
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/sync
          command: d1 execute jox3 --remote --file=schema.sql

      - name: Publicar
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/sync
          command: deploy

      - name: Probar que responde
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          U="${URL:-https://jox3-sync.jox3tv.workers.dev}"
          echo "Dirección: $U"
          # Un subdominio nuevo de workers.dev puede tardar unos minutos en existir
          for i in $(seq 1 30); do curl -fsS "$U/" && break; sleep 10; done; echo
          T=$(date +%s%3N)
          curl -fsS -X POST "$U/v1/sync" -H 'content-type: application/json' \
            -d "{\"acc\":\"$(printf '0%.0s' {1..64})\",\"profile\":\"prueba\",\"since\":0,\"changes\":[{\"list\":\"fav\",\"item\":\"movie:1\",\"data\":\"{}\",\"ts\":$T}]}" \
            | tee /tmp/r.json ; echo
          grep -q '"movie:1"' /tmp/r.json
          # Zona horaria de la conexión
          curl -fsS "$U/v1/tz" | tee /tmp/tz.json ; echo
          grep -q '"tz":"' /tmp/tz.json
          # Saltar intro y créditos: guardar y leer (servidores de prueba "000…" y "111…")
          S=$(printf '0%.0s' {1..32}); S2=$(printf '1%.0s' {1..32}); FP=$(head -c 3000 /dev/urandom | base64 -w0)
          for V in v1 v2; do
            curl -fsS -X POST "$U/$V/skip" -H 'content-type: application/json' \
              -d "{\"s\":\"$S\",\"series\":\"prueba\",\"season\":1,\"name\":\"serie de prueba\",\"eps\":[{\"ep\":\"e1\",\"is\":60000,\"ie\":120000,\"cs\":-1,\"d\":2400000}],\"tpl\":[{\"kind\":\"intro\",\"season\":1,\"fp\":\"$FP\"}],\"prints\":[{\"ep\":\"e1\",\"kind\":\"intro\",\"first\":0,\"d\":2400000,\"fp\":\"$FP\"}]}" | tee /tmp/sk.json; echo
            grep -q '"ok":true' /tmp/sk.json
            curl -fsS "$U/$V/skip?s=$S&series=prueba" | head -c 300 | tee /tmp/sk2.json; echo
            grep -q '"ep":"e1","is":60000,"ie":120000' /tmp/sk2.json
          done
          # La misma serie vista desde otro servidor tuyo: llegan sus plantillas por nombre
          curl -fsS "$U/v2/skip?s=$S2&series=otra&name=serie%20de%20prueba&also=$S" | tee /tmp/sk3.json | head -c 200; echo
          grep -q '"byName":\[{"kind":"intro"' /tmp/sk3.json
          curl -fsS "$U/v1/skip/prints?s=$S&series=prueba&season=1&kind=intro" | head -c 120; echo
          # Ver juntos: crear una sala
          curl -fsS -X POST "$U/v1/room" | tee /tmp/room.json ; echo
          grep -q '"code":"[0-9]\{6\}"' /tmp/room.json
          echo "U=$U" >> "$GITHUB_ENV"
          echo "::notice::Servidor listo en $U"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probar Ver juntos (dos equipos en una sala)
        run: node test/room.mjs

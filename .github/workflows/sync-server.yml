name: Servidor de sincronización

on:
  push:
    paths:
      - "server/sync/**"
      - ".github/workflows/sync-server.yml"
  workflow_dispatch:

concurrency:
  group: sync-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/sync
    steps:
      - uses: actions/checkout@v4

      - name: Revisar el código
        run: node --check src/index.js && node --check src/ai.js

      - name: Crear tablas que falten
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/sync
          command: d1 execute jox3 --remote --file=schema.sql

      - name: Publicar
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/sync
          command: deploy
          # Clave de Gemini (secreto GEMINI_API_KEY de GitHub) → secreto GEMINI_KEY del Worker
          secrets: |
            GEMINI_KEY
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Probar que responde
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          U="${URL:-https://jox3-sync.jox3tv.workers.dev}"
          echo "Dirección: $U"
          # Un subdominio nuevo de workers.dev puede tardar unos minutos en existir
          for i in $(seq 1 30); do curl -fsS "$U/" && break; sleep 10; done; echo
          T=$(date +%s%3N)
          curl -fsS -X POST "$U/v1/sync" -H 'content-type: application/json' \
            -d "{\"acc\":\"$(printf '0%.0s' {1..64})\",\"profile\":\"prueba\",\"since\":0,\"changes\":[{\"list\":\"fav\",\"item\":\"movie:1\",\"data\":\"{}\",\"ts\":$T}]}" \
            | tee /tmp/r.json ; echo
          grep -q '"movie:1"' /tmp/r.json
          # Zona horaria de la conexión
          curl -fsS "$U/v1/tz" | tee /tmp/tz.json ; echo
          grep -q '"tz":"' /tmp/tz.json
          # Saltar intro y créditos: guardar y leer (servidores de prueba "000…" y "111…")
          S=$(printf '0%.0s' {1..32}); S2=$(printf '1%.0s' {1..32}); FP=$(head -c 3000 /dev/urandom | base64 -w0)
          for V in v1 v2; do
            curl -fsS -X POST "$U/$V/skip" -H 'content-type: application/json' \
              -d "{\"s\":\"$S\",\"series\":\"prueba\",\"season\":1,\"name\":\"serie de prueba\",\"eps\":[{\"ep\":\"e1\",\"is\":60000,\"ie\":120000,\"cs\":-1,\"d\":2400000}],\"tpl\":[{\"kind\":\"intro\",\"season\":1,\"fp\":\"$FP\"}],\"prints\":[{\"ep\":\"e1\",\"kind\":\"intro\",\"first\":0,\"d\":2400000,\"fp\":\"$FP\"}]}" | tee /tmp/sk.json; echo
            grep -q '"ok":true' /tmp/sk.json
            curl -fsS "$U/$V/skip?s=$S&series=prueba" | head -c 300 | tee /tmp/sk2.json; echo
            grep -q '"ep":"e1","is":60000,"ie":120000' /tmp/sk2.json
          done
          # La misma serie vista desde otro servidor (de cualquier usuario): llegan sus plantillas y huellas por nombre
          curl -fsS "$U/v2/skip?s=$S2&series=otra&name=serie%20de%20prueba" | tee /tmp/sk3.json | head -c 200; echo
          grep -q '"byName":\[{"kind":"intro"' /tmp/sk3.json
          curl -fsS "$U/v2/skip/prints?s=$S2&series=otra&season=1&kind=intro&name=serie%20de%20prueba" | tee /tmp/sk4.json | head -c 160; echo
          grep -q '"foreign":true' /tmp/sk4.json
          curl -fsS "$U/v1/skip/prints?s=$S&series=prueba&season=1&kind=intro" | head -c 120; echo
          # IA: búsqueda inteligente y guía (si la IA no responde, avisa pero no detiene la publicación)
          curl -sS -X POST "$U/v1/ai/search" -H 'content-type: application/json' \
            -d "{\"q\":\"pon el partido de millonarios hoy $(date +%s)\",\"now\":\"miércoles 20:00\"}" | tee /tmp/ai.json; echo
          echo "::notice::IA de búsqueda respondió con: $(grep -o '"via":"[^"]*"' /tmp/ai.json) · Gemini: $(curl -sS "$U/v1/ai/status" | head -c 400)"
          if grep -q '"ok":true' /tmp/ai.json; then
            grep -q '"kind":"event"' /tmp/ai.json || echo "::warning::La IA no reconoció el partido"
            echo "::notice::IA de búsqueda: $(head -c 300 /tmp/ai.json)"
          else echo "::warning::La IA de búsqueda no respondió: $(head -c 200 /tmp/ai.json)"; fi
          curl -sS -X POST "$U/v1/ai/epg" -H 'content-type: application/json' \
            -d '{"items":[{"n":"WIN SPORTS PLUS HD","c":["Win Sports","Win Sports+","ESPN 2 Colombia"]},{"n":"CNN ES","c":["CNN International","CNN en Español","HLN","Canal '"$(date +%s)"'"]}]}' | tee /tmp/ai2.json; echo
          if grep -q '"ok":true' /tmp/ai2.json; then echo "::notice::IA de guía: $(head -c 200 /tmp/ai2.json)"
          else echo "::warning::La IA de guía no respondió: $(head -c 200 /tmp/ai2.json)"; fi
          # Lo mejor de hoy: de una guía corta debe elegir el partido y no la televenta
          curl -sS -X POST "$U/v1/ai/today" -H 'content-type: application/json' -d "{\"k\":\"prueba-$(date +%s)\",\"now\":\"sábado 6:00 PM\",\"items\":[\"6:00 PM|Win Sports+|Fútbol: Millonarios vs Nacional|Deportes|EN VIVO\",\"6:00 PM|Canal 13|Televentas Mega Ofertas|Compras|\",\"8:00 PM|Cinemax|Oppenheimer|Película|ESTRENO\",\"7:00 PM|CNN|Noticias de la noche|Noticias|\"]}" | tee /tmp/ai4.json; echo
          if grep -q '"ok":true' /tmp/ai4.json && grep -q '"i":0' /tmp/ai4.json && ! grep -q '"i":1,' /tmp/ai4.json; then echo "::notice::Lo mejor de hoy: $(head -c 300 /tmp/ai4.json)"
          else echo "::warning::Lo mejor de hoy no respondió bien: $(head -c 300 /tmp/ai4.json)"; fi
          # Vigilante de señal: barras de colores con "NO SIGNAL" → debe decir que falla
          printf '{"n":"Canal de prueba","img":"%s"}' "$(base64 -w0 test/bars.jpg)" > /tmp/frame.json
          curl -sS -X POST "$U/v1/ai/frame" -H 'content-type: application/json' --data @/tmp/frame.json | tee /tmp/ai3.json; echo
          if grep -q '"bad":true' /tmp/ai3.json; then echo "::notice::Vigilante: $(head -c 300 /tmp/ai3.json)"
          else echo "::warning::El vigilante no reconoció las barras: $(head -c 300 /tmp/ai3.json)"; fi
          # Ver juntos: crear una sala
          curl -fsS -X POST "$U/v1/room" | tee /tmp/room.json ; echo
          grep -q '"code":"[0-9]\{6\}"' /tmp/room.json
          echo "U=$U" >> "$GITHUB_ENV"
          echo "::notice::Servidor listo en $U"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probar Ver juntos (dos equipos en una sala)
        run: node test/room.mjs

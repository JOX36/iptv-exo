name: Build Desktop (Windows)

# Programa de PC (carpeta desktop/). Va aparte de la app Android (build.yml):
# solo se ejecuta cuando cambia algo de desktop/ o este archivo.
on:
  push:
    branches: [ '**' ]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:          # botón "Run workflow" manual en la pestaña Actions

permissions:
  contents: write             # para publicar la versión (Release) con el instalador
  pull-requests: read         # para leer las novedades del PR publicado

env:
  VLC_VERSION: '3.0.21'     # versión de VLC incluida en el instalador

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # VLC oficial para incluirlo dentro del instalador (se guarda en caché entre compilaciones).
      - name: Caché de VLC
        id: vlc-cache
        uses: actions/cache@v4
        with:
          path: desktop/vlc
          key: vlc-${{ env.VLC_VERSION }}-win64-v3

      - name: Preparar VLC
        if: steps.vlc-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = "${{ env.VLC_VERSION }}"
          $url = "https://download.videolan.org/pub/videolan/vlc/$v/win64/vlc-$v-win64.zip"
          $zip = Join-Path $env:RUNNER_TEMP "vlc.zip"
          for ($i = 1; $i -le 3; $i++) {
            try { Invoke-WebRequest $url -OutFile $zip -UseBasicParsing; break } catch { if ($i -eq 3) { throw } ; Start-Sleep 10 }
          }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Output "SHA256 de VLC: $hash"
          # Se compara con la huella oficial publicada por VideoLAN
          try {
            $c = (Invoke-WebRequest "$url.sha256" -UseBasicParsing).Content
            if ($c -is [byte[]]) { $c = [Text.Encoding]::ASCII.GetString($c) }
            $official = ($c.Trim() -split '\s+')[0].ToLower()
            if ($official -ne $hash) { Write-Output "::error::La descarga de VLC no coincide con la huella oficial"; exit 1 }
            Write-Output "Huella oficial verificada"
          } catch { Write-Output "::warning::No se pudo leer la huella oficial de VLC ($($_.Exception.Message))" }
          $tmp = Join-Path $env:RUNNER_TEMP "vlc"
          Expand-Archive $zip -DestinationPath $tmp -Force
          $src = Get-ChildItem $tmp -Directory | Select-Object -First 1
          $dst = "desktop/vlc/windows/vlc"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item (Join-Path $src.FullName "libvlc.dll"), (Join-Path $src.FullName "libvlccore.dll") $dst
          Copy-Item (Join-Path $src.FullName "plugins") $dst -Recurse
          # Fuera lo que el programa no usa (interfaz propia de VLC, visualizaciones,
          # grabar/retransmitir y buscar dispositivos en la red): instalador más liviano
          foreach ($d in "gui", "visualization", "video_splitter", "stream_out", "access_output", "mux", "services_discovery") {
            $p = Join-Path $dst "plugins/$d"; if (Test-Path $p) { Remove-Item $p -Recurse -Force }
          }
          # Solo el script de YouTube (para ver tráileres dentro del programa)
          $yt = Get-ChildItem (Join-Path $src.FullName "lua/playlist") -Filter "youtube.*" | Select-Object -First 1
          if ($yt) {
            New-Item -ItemType Directory -Force (Join-Path $dst "lua/playlist") | Out-Null
            Copy-Item $yt.FullName (Join-Path $dst "lua/playlist")
          } else { Write-Output "::warning::No se encontró el script de YouTube de VLC" }
          # Caché de plugins: así VLC no los revisa uno por uno cada vez que abre (arranque más rápido)
          & (Join-Path $src.FullName "vlc-cache-gen.exe") (Resolve-Path (Join-Path $dst "plugins")).Path
          $mb = [math]::Round(((Get-ChildItem $dst -Recurse | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Output "VLC listo: $mb MB"

      # Primero las pruebas automáticas; si alguna falla, no se genera el instalador.
      # createDistributable deja el programa armado (carpeta app/) para la autoprueba.
      # Luego el instalador .msi (incluye su propio Java: el usuario no necesita instalar nada más).
      - name: Pruebas e instalador MSI
        env:
          # Token de TMDB (información de películas y series): el mismo secreto de la app Android
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          set -o pipefail
          gradle -p desktop test createDistributable packageMsi -PappVersion=1.0.${{ github.run_number }} --stacktrace 2>&1 | tee build.log

      # Abre el programa ya empaquetado en modo autoprueba (sin ventana) y revisa que no le falte nada.
      - name: Autoprueba del programa empaquetado
        shell: pwsh
        run: |
          $exe = Get-ChildItem "desktop/build/compose/binaries" -Recurse -Filter "*.exe" | Where-Object { $_.Name -like "JOX3*" } | Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem "desktop/build/compose/binaries" -Recurse -Depth 3 | ForEach-Object { $_.FullName }
            Write-Output "::error::No se encontró el programa empaquetado (JOX3 TV.exe)"; exit 1
          }
          Write-Output "Programa: $($exe.FullName)"
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--self-test", "`"$out`"" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out } else { Write-Output "::error::La autoprueba no dejó resultado (código $($p.ExitCode))"; exit 1 }
          Get-Content $out | Where-Object { $_ -like "FALLA*" } | ForEach-Object { Write-Output "::error::Autoprueba: $_" }
          if ($p.ExitCode -ne 0) { exit 1 }

      # Si falla, los errores aparecen como anotaciones en la pestaña del PR / Actions
      - name: Resumen de errores
        if: failure()
        run: |
          { grep -E "^e: |error:| FAILED$" build.log; grep -E -A2 "^\s+(java|kotlin|org\.opentest4j)\..*(Error|Exception)" build.log; \
            grep -E -A3 "What went wrong|Could not (find|resolve)" build.log; } \
            | head -45 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Informe de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-${{ github.run_number }}
          path: desktop/build/reports/tests/test/
          if-no-files-found: ignore

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: jox3-tv-desktop-${{ github.run_number }}
          path: desktop/build/compose/binaries/main/msi/*.msi

      # Cada cambio de desktop/ que llega a main se publica como versión desktop-v1.0.N.
      # --latest=false: así la app Android sigue viendo SU última versión (v1.1.N) y no la de PC.
      - name: Publicar versión
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          MSI=$(ls desktop/build/compose/binaries/main/msi/*.msi | head -1)
          cp "$MSI" "JOX3-TV-PC-$VERSION.msi"
          PR_BODY=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].body // ""' 2>/dev/null || true)
          NOTES=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | awk '/^##+ *Novedades/{f=1;next} /^##/{f=0} f' | sed '/^\s*$/d')
          if [ -z "$NOTES" ]; then
            NOTES=$(printf '%s\n' "$HEAD_MSG" | grep -viE '^(merge pull request|co-authored-by|claude-session)' | sed '/^\s*$/d')
          fi
          gh release create "desktop-v$VERSION" "JOX3-TV-PC-$VERSION.msi" \
            --title "JOX3 TV para PC $VERSION" \
            --notes "${NOTES:-Mejoras y correcciones.}" \
            --target "${{ github.sha }}" \
            --latest=false

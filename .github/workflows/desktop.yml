name: Build Desktop (Windows)

# Programa de PC (carpeta desktop/). Va aparte de la app Android (build.yml):
# solo se ejecuta cuando cambia algo de desktop/ o este archivo.
on:
  push:
    branches: [ '**' ]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:          # botón "Run workflow" manual en la pestaña Actions

permissions:
  contents: write             # para publicar la versión (Release) con el instalador
  pull-requests: read         # para leer las novedades del PR publicado

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Instalador .msi (incluye su propio Java: el usuario no necesita instalar nada más).
      - name: Build MSI
        run: |
          set -o pipefail
          gradle -p desktop packageMsi -PappVersion=1.0.${{ github.run_number }} --stacktrace 2>&1 | tee build.log

      # Si falla, los errores aparecen como anotaciones en la pestaña del PR / Actions
      - name: Resumen de errores
        if: failure()
        run: |
          { grep -E "^e: |error:" build.log; grep -E -A3 "What went wrong|Could not (find|resolve)" build.log; } \
            | head -45 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: jox3-tv-desktop-${{ github.run_number }}
          path: desktop/build/compose/binaries/main/msi/*.msi

      # Cada cambio de desktop/ que llega a main se publica como versión desktop-v1.0.N.
      # --latest=false: así la app Android sigue viendo SU última versión (v1.1.N) y no la de PC.
      - name: Publicar versión
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          MSI=$(ls desktop/build/compose/binaries/main/msi/*.msi | head -1)
          cp "$MSI" "JOX3-TV-PC-$VERSION.msi"
          PR_BODY=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].body // ""' 2>/dev/null || true)
          NOTES=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | awk '/^##+ *Novedades/{f=1;next} /^##/{f=0} f' | sed '/^\s*$/d')
          if [ -z "$NOTES" ]; then
            NOTES=$(printf '%s\n' "$HEAD_MSG" | grep -viE '^(merge pull request|co-authored-by|claude-session)' | sed '/^\s*$/d')
          fi
          gh release create "desktop-v$VERSION" "JOX3-TV-PC-$VERSION.msi" \
            --title "JOX3 TV para PC $VERSION" \
            --notes "${NOTES:-Mejoras y correcciones.}" \
            --target "${{ github.sha }}" \
            --latest=false

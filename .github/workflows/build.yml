name: Build APK

on:
  push:
    branches: [ '**' ]        # compila cualquier rama, no solo main
  pull_request:
  workflow_dispatch:          # botón "Run workflow" manual en la pestaña Actions

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true    # si subes otro commit, cancela la compilación anterior

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle oficial con caché de dependencias: las compilaciones siguientes
      # son bastante más rápidas y no depende de descargar el wrapper a mano.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      # Firma de producción opcional: solo corre si configuraste los secretos
      - name: Build Release APK (firmada)
        if: ${{ github.ref == 'refs/heads/main' && env.HAS_KEYSTORE == 'true' }}
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RELEASE_KEYSTORE_FILE"
          gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-exo-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk

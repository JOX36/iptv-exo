name: Build APK

on:
  push:
    branches: [ '**' ]        # compila cualquier rama, no solo main
  pull_request:
  workflow_dispatch:          # botón "Run workflow" manual en la pestaña Actions

permissions:
  contents: write             # para publicar la versión (Release) con el APK
  pull-requests: read         # para leer las novedades del PR publicado

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true    # si subes otro commit, cancela la compilación anterior

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle oficial con caché de dependencias: las compilaciones siguientes
      # son bastante más rápidas y no depende de descargar el wrapper a mano.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      # Ramas de prueba: APK debug. main: APK release (el que se publica).
      - name: Build APK
        env:
          # Token de TMDB (información de películas y series): secreto del repositorio
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TASK=assembleRelease
          else
            TASK=assembleDebug
          fi
          gradle $TASK 2>&1 | tee build.log

      # Si falla, los errores aparecen como anotaciones en la pestaña del PR / Actions
      - name: Resumen de errores
        if: failure()
        run: |
          # Primero los errores de compilación (Kotlin "e: ", Java "error:"), luego el resto
          { grep -E "^e: |error:" build.log; grep -E -A3 "What went wrong|Could not (find|resolve)" build.log; } \
            | head -45 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-exo-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk

      # Cada cambio que llega a main se publica como versión: la app la detecta
      # al abrirse y ofrece instalarla sola (también en el TV Box).
      - name: Publicar versión
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION="1.1.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "JOX3-TV-$VERSION.apk"
          # Novedades del aviso: la sección "## Novedades" del PR (en palabras simples).
          # Si no hay, el mensaje del cambio.
          PR_BODY=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].body // ""' 2>/dev/null || true)
          NOTES=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | awk '/^##+ *Novedades/{f=1;next} /^##/{f=0} f' | sed '/^\s*$/d')
          if [ -z "$NOTES" ]; then
            NOTES=$(printf '%s\n' "$HEAD_MSG" | grep -viE '^(merge pull request|co-authored-by|claude-session)' | sed '/^\s*$/d')
          fi
          # latest.json: lo que la app lee para saber si hay versión nueva. Se descarga de
          # releases/latest/download/ (sin el límite de 60 consultas por hora de la API).
          export VERSION NOTES
          export APK_URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/JOX3-TV-$VERSION.apk"
          export APK_SIZE=$(stat -c %s "JOX3-TV-$VERSION.apk")
          python3 -c 'import json,os; json.dump({"version":os.environ["VERSION"],"apk":os.environ["APK_URL"],"size":int(os.environ["APK_SIZE"]),"notes":os.environ.get("NOTES") or "Mejoras y correcciones."}, open("latest.json","w"), ensure_ascii=False)'
          gh release create "v$VERSION" "JOX3-TV-$VERSION.apk" latest.json \
            --title "JOX3 TV $VERSION" \
            --notes "${NOTES:-Mejoras y correcciones.}" \
            --target "${{ github.sha }}"

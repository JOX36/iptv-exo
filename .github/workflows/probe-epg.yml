name: Probar fuentes EPG (temporal)
on:
  push:
    branches: [guia-completa]
    paths: [".github/workflows/probe-epg.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Archivos de open-epg
        continue-on-error: true
        run: |
          exec > >(tee /tmp/out1.txt) 2>&1
          for c in colombia mexico argentina chile peru ecuador venezuela uruguay paraguay bolivia costarica panama guatemala honduras dominican puertorico spain usa canada brazil portugal sports; do
            line="$c:"
            for n in 1 2 3 4; do
              sleep 1
              code=$(curl -sL -o /tmp/f -w "%{http_code}" --max-time 60 "https://www.open-epg.com/files/$c$n.xml.gz")
              ch=$(zcat /tmp/f 2>/dev/null | grep -c '<channel id=' || true)
              [ "$ch" != "0" ] && line="$line $n=$ch"
            done
            echo "$line"
          done
          echo "--- win/caracol en open-epg colombia"
          for n in 1 2 3; do curl -sL "https://www.open-epg.com/files/colombia$n.xml.gz" | zcat 2>/dev/null | grep -io '<channel id="[^"]*"' | grep -i "win\|caracol\|rcn\|espn\|directv" ; done | sort -u
          echo "--- fechas"; curl -sL "https://www.open-epg.com/files/colombia1.xml.gz" | zcat | grep -o 'start="[0-9]\{8\}' | sort | uniq -c
          echo "--- etiquetas"; curl -sL "https://www.open-epg.com/files/colombia1.xml.gz" | zcat | grep -o '<icon[^>]*>\|<category[^>]*>[^<]*\|<new */>\|<live */>\|<premiere[^>]*>\|<episode-num[^>]*>' | cut -c1-50 | sort | uniq -c | sort -rn | head -10
      - name: Resultado
        if: always()
        run: |
          for f in /tmp/out1.txt /tmp/out2.txt /tmp/out3.txt; do
            sleep 1
            body=$(cat $f | tr -d '\r' | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::notice title=$f::$body"
          done

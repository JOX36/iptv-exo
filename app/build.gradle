plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jox3.iptvexo'
    compileSdk 34

    defaultConfig {
        applicationId "com.jox3.iptvexo"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Keystore de debug FIJO. Sin esto, cada build de GitHub Actions corre en una
    // maquina nueva y Gradle genera un keystore distinto cada vez, obligando a
    // desinstalar la app antes de poder instalar la build siguiente.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'jox3debug123'
            keyAlias 'jox3debugkey'
            keyPassword 'jox3debug123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.3.1'

    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.3.1+2'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

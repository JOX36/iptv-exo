complementos {
    id 'com.android.application'
}

Android {
    espacio de nombres 'com.jox3.iptvexo'
    compileSdk 34

    Configuración predeterminada {
        ID de aplicación "com.jox3.iptvexo"
        minSdk 21
        targetSdk 34
        Código de versión 1
        nombre de la versión "1.0"
    }

    // Keystore de debug FIJO — sin esto, cada compilación de GitHub Actions corre en una
    // máquina nueva y Gradle genera un almacén de claves distinto cada vez, obligando a
    // desinstalar la aplicación antes de poder instalar la compilación siguiente.
    Configuración de firma {
        depurar {
            almacenarArchivo archivo('debug.keystore')
            Contraseña de la tienda 'jox3debug123'
            keyAlias ​​'jox3debugkey'
            Contraseña 'jox3debug123'
        }
    }

    buildTypes {
        depurar {
            Configuración de firma Configuración de firma.debug
        }
        liberar {
            Configuración de firma Configuración de firma.debug
            minifyEnabled falso
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    opciones de compilación {
        Compatibilidad de origen JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        // Solicitado por media3-ffmpeg-decoder (Jellyfin)
        coreLibraryDesugaringEnabled true
    }
}

dependencias {
    implementación 'androidx.appcompat:appcompat:1.6.1'
    implementación 'com.google.android.material:material:1.9.0'
    implementación 'androidx.constraintlayout:constraintlayout:2.1.4'

    // OkHttp
    implementación 'com.squareup.okhttp3:okhttp:4.12.0'

    // Media3 / ExoPlayer
    implementación 'androidx.media3:media3-exoplayer:1.3.1'
    implementación 'androidx.media3:media3-ui:1.3.1'
    implementación 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementación 'androidx.media3:media3-datasource-okhttp:1.3.1'

    // Decodificador FFmpeg precompilado (Jellyfin) — soporte HEVC/AC3/DTS por software
    implementación 'org.jellyfin.media3:media3-ffmpeg-decoder:1.3.1+2'

    // Desazucaring — requerido por el decodificador FFmpeg
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jox3.iptvexo'
    compileSdk 35

    defaultConfig {
        applicationId "com.jox3.iptvexo"
        minSdk 21
        targetSdk 34
        // En GitHub Actions cada compilación sube el número de versión automáticamente,
        // así Android reconoce cada APK como una actualización de la anterior.
        def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
        versionCode 1 + runNumber
        versionName "1.1." + runNumber
    }

    // Keystore de debug FIJO. Sin esto, cada build de GitHub Actions corre en una
    // maquina nueva y Gradle genera un keystore distinto cada vez, obligando a
    // desinstalar la app antes de poder instalar la build siguiente.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'jox3debug123'
            keyAlias 'jox3debugkey'
            keyPassword 'jox3debug123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Misma llave fija que las compilaciones de prueba: así cada versión
            // publicada se instala ENCIMA de la anterior (necesario para actualizar solo).
            // Si algún día se cambia esta llave, habrá que desinstalar una vez.
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // El análisis de lint de release puede frenar la publicación por avisos menores
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Pantalla de inicio oficial (Android 12+, compatible hacia atrás)
    implementation 'androidx.core:core-splashscreen:1.0.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Media3 (ExoPlayer) — una sola versión para todos los módulos
    def media3 = '1.5.0'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-datasource-okhttp:$media3"
    // Sesión multimedia: control remoto, Bluetooth, Google Assistant, "Reproduciendo ahora"
    implementation "androidx.media3:media3-session:$media3"

    // Decodificador FFmpeg por software (HEVC/AC3/DTS) — debe coincidir con la versión de Media3
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.5.0+1'

    // Chromecast: SDK de Google Cast + MediaRouteButton (icono que abre el selector de dispositivos)
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
